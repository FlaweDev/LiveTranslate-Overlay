name: CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - develop
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       
      issues: write         
      pull-requests: write  
    
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      is_prerelease: ${{ steps.semantic.outputs.new_release_prerelease }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-pack:
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.published == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Publish .NET UI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish src/ui/LiveTranslateOverlay.csproj -c Release -r win-x64 --self-contained true -p:Publishing=true -p:DebugType=None -p:DebugSymbols=false -o dist
          if (-not (Test-Path "dist/LiveTranslateOverlay.exe")) {
            Write-Error "Build failed: LiveTranslateOverlay.exe was not generated."
            exit 1
          }

      - name: Bundle Portable Python & uv
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv python install 3.11 --install-dir dist/runtime/python
          Get-ChildItem -Path dist/runtime/python -Filter "EXTERNALLY-MANAGED" -Recurse | Remove-Item -Force
          Copy-Item -Path (Get-Command uv).Source -Destination dist/runtime/uv.exe -Force

      - name: Copy Engine, Config & Create Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/engine, dist/config
          Copy-Item -Path src/engine/* -Destination dist/engine -Recurse -Force -Exclude "__pycache__", "*.pyc", ".venv", "venv"
          Copy-Item -Path config/appsettings.json -Destination dist/config/appsettings.json -Force

          Compress-Archive -Path dist/* -DestinationPath "LiveTranslate-Overlay-Portable-v${{ needs.release.outputs.version }}-win-x64.zip" -Force

      - name: Upload GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: "Release v${{ needs.release.outputs.version }}"
          files: LiveTranslate-Overlay-Portable-v${{ needs.release.outputs.version }}-win-x64.zip
          prerelease: ${{ needs.release.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          make_latest: ${{ needs.release.outputs.is_prerelease != 'true' }}