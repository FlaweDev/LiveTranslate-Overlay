name: Build & Release Portable Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 Portable (.NET 10)
    runs-on: windows-latest
    # Запускаем при ручном вызове или при слиянии (merge) в main
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    env:
      BUNDLE_NAME: LiveTranslate-Overlay
      DIST_DIR: dist/LiveTranslate-Overlay

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Prepare bundle directory structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.DIST_DIR }}/runtime/python"
          New-Item -ItemType Directory -Force -Path "${{ env.DIST_DIR }}/engine"
          New-Item -ItemType Directory -Force -Path "${{ env.DIST_DIR }}/config"

      - name: Publish .NET 10 UI (Self-Contained, libraries moved to lib/)
        shell: pwsh
        run: |
          dotnet publish src/ui/LiveTranslateOverlay.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Publishing=true `
            -o "${{ env.DIST_DIR }}"

      - name: Fix runtimeconfig.json probing paths for native libraries
        shell: pwsh
        run: |
          # Преобразуем относительный путь NATIVE_DLL_SEARCH_DIRECTORIES в корректный формат для Windows
          $rcPath = "${{ env.DIST_DIR }}/LiveTranslateOverlay.runtimeconfig.json"
          if (Test-Path $rcPath) {
            $json = Get-Content$rcPath -Raw | ConvertFrom-Json
            $appPathsProp =$json.runtimeOptions.configProperties | Get-Member -Name "APP_PATHS"
            if (-not $appPathsProp) {$json.runtimeOptions | Add-Member -NotePropertyName "additionalProbingPaths" -NotePropertyValue @("lib") -Force
            }
            $json \vert{} ConvertTo-Json -Depth 10 \vert{} Set-Content$rcPath -Encoding UTF8
          }

      - name: Bundle Standalone Python 3.11 & uv
        shell: pwsh
        run: |
          uv python install 3.11 --install-dir "${{ env.DIST_DIR }}/runtime/python"

          $uvPath = (Get-Command uv).Source
          Copy-Item -Path $uvPath -Destination "${{ env.DIST_DIR }}/runtime/uv.exe" -Force

      - name: Copy Python Engine & Production Config
        shell: pwsh
        run: |
          Copy-Item -Path "src/engine/*" `
                    -Destination "${{ env.DIST_DIR }}/engine" `
                    -Recurse `
                    -Force `
                    -Exclude "__pycache__", "*.pyc", ".venv", "venv", ".pytest_cache"

          Copy-Item -Path "config/appsettings.json" `
                    -Destination "${{ env.DIST_DIR }}/config/appsettings.json" `
                    -Force

          if (Test-Path "README.md") {
            Copy-Item -Path "README.md" -Destination "${{ env.DIST_DIR }}/README.md" -Force
          }
          if (Test-Path "LICENSE") {
            Copy-Item -Path "LICENSE" -Destination "${{ env.DIST_DIR }}/LICENSE" -Force
          }

      - name: Clean up debug symbols (.pdb)
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ env.DIST_DIR }}" -Filter "*.pdb" -Recurse | Remove-Item -Force

      - name: Determine Release Version & Create Archive
        shell: pwsh
        run: |
          $tagVersion = "v1.0.${{ github.run_number }}"
          $archiveName = "${{ env.BUNDLE_NAME }}-Portable-$tagVersion-win-x64.zip"

          Compress-Archive -Path "${{ env.DIST_DIR }}/*" -DestinationPath $archiveName -Force

          echo "RELEASE_TAG=$tagVersion" >> $env:GITHUB_ENV
          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release (on merge to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
          make_latest: true