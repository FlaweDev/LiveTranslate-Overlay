name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Build Portable Bundle
        shell: pwsh
        run: |
          dotnet publish src/ui/LiveTranslateOverlay.csproj -c Release -r win-x64 --self-contained true -p:Publishing=true -p:DebugType=None -p:DebugSymbols=false -o dist

          uv python install 3.11 --install-dir dist/runtime/python
          Copy-Item -Path (Get-Command uv).Source -Destination dist/runtime/uv.exe -Force

          New-Item -ItemType Directory -Force -Path dist/engine, dist/config
          Copy-Item -Path src/engine/* -Destination dist/engine -Recurse -Force -Exclude "__pycache__", "*.pyc", ".venv", "venv"
          Copy-Item -Path config/appsettings.json -Destination dist/config/appsettings.json -Force

          Compress-Archive -Path dist/* -DestinationPath LiveTranslate-Overlay-Portable-win-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-Overlay-Portable-win-x64
          path: LiveTranslate-Overlay-Portable-win-x64.zip

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: LiveTranslate-Overlay-Portable-win-x64.zip
          generate_release_notes: true
          make_latest: true